name: "Spira 47 complete required source gates r38"
on:
  push:
    branches: ["ci/spira47-dollar-runtime-20261127-r38"]
    paths:
      - ".github/workflows/spira47-review-r38.yml"
      - "ci-tools/spira47-review-r38/**"
permissions:
  contents: read
  actions: read
concurrency:
  group: "spira47-review-r38-${{ github.ref }}"
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  verify:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 120
    steps:
      - name: Checkout this isolated proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
      - name: Checkout unchanged Spira base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/Spira
          ref: 593d792bf282f7b7119dafb057a389b04c91fd6d
          path: source
          persist-credentials: false
      - name: Checkout immutable LoGOs toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/LoGOs
          ref: 2cfe17218b4d3311c5746b94a1858bf3fe9a3e45
          path: compiler
          persist-credentials: false
      - name: Install official bootstrap Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.4"
          cache: false
      - name: Build the immutable LoGOs compiler
        run: |
          export GOENV=off GOCACHEPROG='' GOMAXPROCS=4 GOFLAGS=-p=4
          test -z "$(go env GOCACHEPROG)"
          echo "UPSTREAM_GO=$(command -v go)" >> "$GITHUB_ENV"
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          test "$(git -C compiler rev-parse HEAD)" = "2cfe17218b4d3311c5746b94a1858bf3fe9a3e45"
          test "$(git -C compiler rev-parse HEAD^{tree})" = "27b36e93b40d0e90ef983f4326c01a049b2196c5"
          cd compiler/src
          ./make.bash
          test -z "$(git status --porcelain --untracked-files=no)"
          sha256sum ../bin/go ../bin/logos
          echo "LOGOS_ROOT=$GITHUB_WORKSPACE/compiler" >> "$GITHUB_ENV"
          echo "GOROOT=$GITHUB_WORKSPACE/compiler" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/compiler/bin" >> "$GITHUB_PATH"
      - name: Install required recipe runner
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: "just@1.59.0"
      - name: Install pinned ripgrep required by sql-check
        run: |
          tool_dir="$RUNNER_TEMP/spira-r38-tools"
          archive="$RUNNER_TEMP/ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" --directory "$tool_dir" --strip-components=1 \
            ripgrep-15.1.0-x86_64-unknown-linux-musl/rg
          test "$("$tool_dir/rg" --version | head -n 1)" = "ripgrep 15.1.0"
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Install the source-pinned package manager
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: "12.21.0"
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.9"
          python-version: "3.15"
          enable-cache: false
      - name: Authenticate focused evidence and complete required source gates
        env:
          SPIRA_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          export GOENV=off GOCACHEPROG=''
          test -z "$(go env GOCACHEPROG)"
          uv run --no-project --python 3.15 proof/ci-tools/spira47-review-r38/verify_completion.py \
            source proof/ci-tools/spira47-review-r38 "$RUNNER_TEMP/spira47-dollar-runtime-completion-evidence"
      - name: Preserve source, baseline and complete gate evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: spira47-dollar-runtime-completion-r38
          path: ${{ runner.temp }}/spira47-dollar-runtime-completion-evidence
          if-no-files-found: error
          retention-days: 14
