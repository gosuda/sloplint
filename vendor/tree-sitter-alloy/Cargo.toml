[package]
name = "tree-sitter-alloy"
version = "0.0.1"
description = "Alloy grammar for tree-sitter"
readme = "README.md"
keywords = [
    "incremental",
    "parsing",
    "tree-sitter",
    "alloy",
]
categories = [
    "parsing",
    "text-editors",
]
license = "MIT"
repository = "https://github.com/vincentlu/tree-sitter-alloy"
edition = "2021"
build = "bindings/rust/build.rs"

[lib]
name = "tree_sitter_alloy"
path = "bindings/rust/lib.rs"

[workspace]

[dependencies.tree-sitter-language]
version = "0.1"

[dev-dependencies.tree-sitter]
version = "0.24"

[build-dependencies.cc]
version = "1.2"
