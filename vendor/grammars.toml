# Pinned upstream commits for the vendored tree-sitter grammars.
#
# One [[grammar]] table per directory under vendor/tree-sitter-*/ (29),
# plus the crates.io dependency tree-sitter-r (kind "crate").
# This file describes what is vendored TODAY. It never changes grammar
# content; bumps are separate commits that re-vendor and regenerate.
#
# kind: "vendored-patched" (upstream plus a patch series),
#   "vendored-pristine" (upstream tree vendored without grammar changes),
#   "own" (no upstream; only tree-sitter-logos),
#   "crate" (used directly from crates.io; only tree-sitter-r).
# commit: full 40-hex upstream commit the vendored base corresponds to.
#   For crates.io bases this is the .cargo_vcs_info.json sha1 of the
#   published crate version. UNRESOLVED is allowed only for
#   tree-sitter-logos (own dialect, no upstream commit exists).
# generator: tree-sitter CLI that produced the vendored src/ (SLOPLINT.md
#   claim corrected against src/parser.c LANGUAGE_VERSION; see notes).
# abi: LANGUAGE_VERSION carried by the vendored src/parser.c
#   (14 for c, odin, tlaplus; 15 for everything else vendored).
# patch: path to sloplint-grammar.patch, or "" when there is no patch.
# patch_status: "none" | "local" | "upstream-pending".
# patch_upstream: upstream PR, issue, commit, or release the patch follows,
#   or "" when there is none.
#
# Tooling: scripts/grammars.sh check (offline) enforces the manifest
# invariants. See vendor/README.md for the pinning policy.

