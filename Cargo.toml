[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
sloplint-core = { path = "crates/sloplint-core" }
sloplint-syntax = { path = "crates/sloplint-syntax" }
tree-sitter = "0.27.1"
tree-sitter-rust = { path = "vendor/tree-sitter-rust" }
tree-sitter-typescript = { path = "vendor/tree-sitter-typescript" }
tree-sitter-go = { path = "vendor/tree-sitter-go" }
tree-sitter-python = "0.25.0"
tree-sitter-javascript = { path = "vendor/tree-sitter-javascript" }
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-c = { path = "vendor/tree-sitter-c" }
tree-sitter-cpp = { path = "vendor/tree-sitter-cpp" }
tree-sitter-objc = "3.0.2"
tree-sitter-php = "0.25.1"
tree-sitter-ruby = { path = "vendor/tree-sitter-ruby" }
tree-sitter-bash = "0.25.1"
tree-sitter-powershell = { path = "vendor/tree-sitter-powershell" }
tree-sitter-swift = "0.7.4"
tree-sitter-r = "1.3.0"
tree-sitter-scala = "0.26.3"
tree-sitter-dart = "0.2.0"
tree-sitter-zig = "1.1.2"
tree-sitter-ocaml = "0.26.0"
tree-sitter-odin = "1.3.0"
tree-sitter-starlark = { path = "vendor/tree-sitter-starlark" }
rayon = "1.12.0"
ignore = "0.4.33"
globset = "0.4.20"
serde = { version = "1.0.229", features = ["derive"] }
sonic-rs = "0.5"
toml = "1.1.8"
clap = { version = "4.6.7", features = ["derive"] }
annotate-snippets = "0.12.16"
anstream = "1.0.0"
thiserror = "2.0.21"
blake3 = "1.8.7"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
proptest = "1.12.0"
tempfile = "3.27.0"
libc = "0.2.191"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
