[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
sloplint-core = { path = "crates/sloplint-core" }
sloplint-syntax = { path = "crates/sloplint-syntax" }
tree-sitter = "0.27.2"
tree-sitter-rust = { path = "vendor/tree-sitter-rust" }
tree-sitter-typescript = { path = "vendor/tree-sitter-typescript" }
tree-sitter-go = { path = "vendor/tree-sitter-go" }
tree-sitter-logos = { path = "vendor/tree-sitter-logos" }
tree-sitter-python = { path = "vendor/tree-sitter-python" }
tree-sitter-javascript = { path = "vendor/tree-sitter-javascript" }
tree-sitter-java = { path = "vendor/tree-sitter-java" }
tree-sitter-kotlin-ng = { path = "vendor/tree-sitter-kotlin-ng" }
tree-sitter-c-sharp = { path = "vendor/tree-sitter-c-sharp" }
tree-sitter-c = { path = "vendor/tree-sitter-c" }
tree-sitter-cpp = { path = "vendor/tree-sitter-cpp" }
tree-sitter-objc = { path = "vendor/tree-sitter-objc" }
tree-sitter-php = { path = "vendor/tree-sitter-php" }
tree-sitter-ruby = { path = "vendor/tree-sitter-ruby" }
tree-sitter-bash = { path = "vendor/tree-sitter-bash" }
tree-sitter-powershell = { path = "vendor/tree-sitter-powershell" }
tree-sitter-swift = { path = "vendor/tree-sitter-swift" }
tree-sitter-r = "1.3.0"
tree-sitter-scala = { path = "vendor/tree-sitter-scala" }
tree-sitter-dart = { path = "vendor/tree-sitter-dart" }
tree-sitter-zig = { path = "vendor/tree-sitter-zig" }
tree-sitter-ocaml = { path = "vendor/tree-sitter-ocaml" }
tree-sitter-odin = { path = "vendor/tree-sitter-odin" }
tree-sitter-starlark = { path = "vendor/tree-sitter-starlark" }
tree-sitter-alloy = { path = "vendor/tree-sitter-alloy" }
tree-sitter-lean = { path = "vendor/tree-sitter-lean" }
tree-sitter-quint = { path = "vendor/tree-sitter-quint" }
tree-sitter-tlaplus = { path = "vendor/tree-sitter-tlaplus" }
rayon = "1.12.0"
ignore = "0.4.34"
globset = "0.4.21"
serde = { version = "1.0.229", features = ["derive"] }
sonic-rs = "0.5"
itoa = "1.0.19"
toml = "1.2.1"
clap = { version = "4.6.8", features = ["derive"] }
annotate-snippets = "0.12.18"
anstream = "1.0.0"
thiserror = "2.0.21"
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
proptest = "1.12.0"
tempfile = "3.27.0"
libc = "0.2.191"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
