name: Verify notebook retention accounting
on:
  push:
    branches: [ci/flats-retention-proof-20261126-r15]
    paths:
      - .github/workflows/flats-retention-proof.yml
      - ci-tools/flats-retention/**
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  retention:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: ci-tools/flats-retention
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/flats
          ref: 86c7849c2f608fd751e9a478c2574c49e817f44d
          path: source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.4
          cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          enable-cache: false
      - name: Verify the frozen fault controls and full candidate gates
        run: uv run --no-project --python 3.15 proof/ci-tools/flats-retention/verify.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: flats-retention-${{ github.sha }}
          path: |
            ${{ runner.temp }}/flats-retention/*.log
            ${{ runner.temp }}/flats-retention/*.json
          if-no-files-found: error
          retention-days: 14
