name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-release-build:
        description: The caller builds and self-lints every release target.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  grammar-manifest:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/grammars.sh check

  release-scripts:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/selftest-release-scripts.sh

  deny:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: |
          dir="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$dir.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$dir.tar.gz"
          printf '%s\n' "$CARGO_DENY_SHA256  $RUNNER_TEMP/$dir.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$dir.tar.gz" -C "$RUNNER_TEMP" "$dir/cargo-deny"
          printf '%s\n' "$RUNNER_TEMP/$dir" >> "$GITHUB_PATH"
      - run: cargo deny check

  test:
    # Full proof on Linux: clippy, the whole suite, a release build per
    # Linux target, and the single self-lint run.
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs_on: depot-ubuntu-24.04, target: x86_64-unknown-linux-gnu, require_fs_caps: "1" }
          - { runs_on: depot-ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, require_fs_caps: "1" }
    env:
      CARGO_INCREMENTAL: "0"
      # Keep assertion checks and useful backtraces without full debug symbols.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      SLOPLINT_REQUIRE_FS_CAPS: ${{ matrix.require_fs_caps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - name: Preserve vendor dependency fingerprints
        id: vendor
        run: TZ=UTC find vendor -exec touch -t 200001010000 {} +
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast --target ${{ matrix.target }}
        if: ${{ !cancelled() && steps.vendor.outcome == 'success' }}
      - if: ${{ !inputs.skip-release-build }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Self-lint with the release binary
        if: ${{ !inputs.skip-release-build && matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          bin="target/${{ matrix.target }}/release/sloplint"
          "$bin" check crates --format agent --strictness standard --mode threshold --fail-on minor

  clippy-native:
    # Per-target clippy stays on the native runners: dependency build
    # scripts such as blake3's pass Apple-only cc flags to the host
    # compiler, so cross-target clippy from Linux fails. Split from the
    # test cells so each native job stays under 5 minutes execution.
    # The only target_arch-dependent code in the workspace is one const
    # in the syntax tests (verified by grep; no workspace build.rs emits
    # cfgs), so the Intel cell lints just that package while the other
    # cells lint the whole workspace for their triple.
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: macos-26-intel
            target: x86_64-apple-darwin
            clippy: -p sloplint-syntax --all-targets
          - runs_on: macos-26
            target: aarch64-apple-darwin
            clippy: --workspace --all-targets
          - runs_on: windows-2025
            target: x86_64-pc-windows-msvc
            clippy: --workspace --all-targets
          - runs_on: windows-11-arm
            target: aarch64-pc-windows-msvc
            clippy: --workspace --all-targets
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add target unless preinstalled
        run: |
          target='${{ matrix.target }}'
          found=
          for d in "$HOME"/.rustup/toolchains/*/lib/rustlib/"$target"; do
            [ -d "$d" ] && found=1 && break
          done
          [ -n "$found" ] || rustup target add "$target"
      - name: Preserve vendor dependency fingerprints
        run: TZ=UTC find vendor -exec touch -t 200001010000 {} +
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.target }}
      - name: Clippy for the native target
        run: cargo clippy ${{ matrix.clippy }} --locked --target ${{ matrix.target }} -- -D warnings

  test-native:
    # Native runners prove only what they alone can prove: the platform
    # tests pass and the built executables run on the OS (every test
    # binary executes there, and the integration tests spawn the sloplint
    # binary itself). Everything portable runs in `test` on Linux.
    # Per-target clippy lives in `clippy-native` so each native job stays
    # under 5 minutes execution. The only target_arch-dependent code in
    # the workspace is the recursion ratio asserted on Intel macs, so
    # that cell runs just the recursion suite.
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: macos-26-intel
            target: x86_64-apple-darwin
            tests: -p sloplint-syntax --test recursion_depth
          - runs_on: macos-26
            target: aarch64-apple-darwin
            tests: -p sloplint --lib --test invariants --test configuration --test colocation_paths --test discovery_boundaries --test io_and_cache --test pipeline
          - runs_on: windows-2025
            target: x86_64-pc-windows-msvc
            tests: -p sloplint --test invariants --test pipeline
          - runs_on: windows-11-arm
            target: aarch64-pc-windows-msvc
            tests: -p sloplint --test invariants --test pipeline
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add target unless preinstalled
        run: |
          target='${{ matrix.target }}'
          found=
          for d in "$HOME"/.rustup/toolchains/*/lib/rustlib/"$target"; do
            [ -d "$d" ] && found=1 && break
          done
          [ -n "$found" ] || rustup target add "$target"
      - name: Preserve vendor dependency fingerprints
        id: vendor
        run: TZ=UTC find vendor -exec touch -t 200001010000 {} +
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.target }}
      - name: Run platform-specific tests
        if: ${{ !cancelled() && steps.vendor.outcome == 'success' }}
        run: >
          cargo test --locked --no-fail-fast --target ${{ matrix.target }}
          ${{ matrix.tests }}
