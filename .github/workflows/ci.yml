name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-release-build:
        description: The caller builds and self-lints every release target.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  grammar-manifest:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/grammars.sh check

  release-scripts:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/selftest-release-scripts.sh

  deny:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: |
          dir="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$dir.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$dir.tar.gz"
          printf '%s\n' "$CARGO_DENY_SHA256  $RUNNER_TEMP/$dir.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$dir.tar.gz" -C "$RUNNER_TEMP" "$dir/cargo-deny"
          printf '%s\n' "$RUNNER_TEMP/$dir" >> "$GITHUB_PATH"
      - run: cargo deny check

  test:
    # Full proof on Linux: clippy, the whole suite, a release build per
    # Linux target, and the single self-lint run.
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs_on: depot-ubuntu-24.04, target: x86_64-unknown-linux-gnu, require_fs_caps: "1" }
          - { runs_on: depot-ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, require_fs_caps: "1" }
    env:
      CARGO_INCREMENTAL: "0"
      # Keep assertion checks and useful backtraces without full debug symbols.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      SLOPLINT_REQUIRE_FS_CAPS: ${{ matrix.require_fs_caps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - name: Preserve vendor dependency fingerprints
        id: vendor
        run: TZ=UTC find vendor -exec touch -t 200001010000 {} +
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast --target ${{ matrix.target }}
        if: ${{ !cancelled() && steps.vendor.outcome == 'success' }}
      - if: ${{ !inputs.skip-release-build }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Self-lint with the release binary
        if: ${{ !inputs.skip-release-build && matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          bin="target/${{ matrix.target }}/release/sloplint"
          "$bin" check crates --format agent --strictness standard --mode threshold --fail-on minor

  clippy-cross:
    # Clippy for the macOS and Windows targets runs here on cheap Linux
    # runners: `cargo clippy --target` needs only the target std, no linker
    # and no native runner, so the proof is identical.
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - name: Preserve vendor dependency fingerprints
        run: TZ=UTC find vendor -exec touch -t 200001010000 {} +
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings

  test-native:
    # Native runners prove only what they alone can prove: the target
    # links, the executable runs on the OS, and the platform-gated tests
    # pass. Everything portable runs in `test` on Linux.
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs_on: macos-26-intel, target: x86_64-apple-darwin }
          - { runs_on: macos-26, target: aarch64-apple-darwin }
          - { runs_on: windows-2025, target: x86_64-pc-windows-msvc }
          - { runs_on: windows-11-arm, target: aarch64-pc-windows-msvc }
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - name: Preserve vendor dependency fingerprints
        id: vendor
        run: TZ=UTC find vendor -exec touch -t 200001010000 {} +
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.target }}
      - name: Build for the native target
        run: cargo build --locked --target ${{ matrix.target }}
      - name: Smoke-test the native executable
        run: |
          bin="target/${{ matrix.target }}/debug/sloplint"
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.exe"; fi
          "$bin" --version
      - name: Run platform-specific tests
        if: ${{ !cancelled() && steps.vendor.outcome == 'success' }}
        run: >
          cargo test --locked --no-fail-fast --target ${{ matrix.target }}
          -p sloplint --lib
          --test analysis_boundaries --test cli_output --test colocation_paths
          --test configuration --test discovery_boundaries --test invariants
          --test io_and_cache --test pipeline
      - name: Run platform-sensitive syntax tests
        if: ${{ !cancelled() && steps.vendor.outcome == 'success' }}
        run: cargo test --locked --no-fail-fast --target ${{ matrix.target }} -p sloplint-syntax --test recursion_depth
