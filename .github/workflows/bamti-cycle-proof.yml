name: Verify recursive relation cache review
on:
  push:
    branches: [ci/bamti-cycle-proof-20261126-r9]
    paths:
      - .github/workflows/bamti-cycle-proof.yml
      - ci-tools/bamti-cycle/**
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: source
jobs:
  quality:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: probe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/bamTiScript
          ref: 3997bdda7b98cf16e2872e5331a3ddcc86475ea1
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - name: Verify and stage the frozen candidate
        run: uv run --no-project --python 3.15 ../probe/ci-tools/bamti-cycle/verify.py prepare
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install pinned languages and oracle
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy,rust-src
          test "$(node --version)" = v24.18.0
          rustc --version
          npm ci
          npm ci --prefix formal/quint
      - name: Install pinned Quint evaluator
        run: |
          version=$(node -p 'require("./formal/quint/node_modules/@informalsystems/quint/dist/src/rust/binaryManager.js").QUINT_EVALUATOR_VERSION')
          test "$version" = v0.6.0
          archive="$RUNNER_TEMP/quint-evaluator.tar.gz"
          quint_home="$RUNNER_TEMP/quint"
          evaluator_dir="$quint_home/rust-evaluator-$version"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 15 --max-time 120 "https://github.com/quint-co/quint/releases/download/evaluator/$version/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" --output "$archive"
          printf '61755a09d5052d93a4e75e840059edfd0d3674aeda164b9d2464be3d6e21b1c2  %s\n' "$archive" | sha256sum --check --strict
          mkdir -p "$evaluator_dir"
          tar -xzf "$archive" -C "$evaluator_dir" quint_evaluator
          chmod +x "$evaluator_dir/quint_evaluator"
          printf 'QUINT_HOME=%s\n' "$quint_home" >> "$GITHUB_ENV"
      - name: Compare authority and old source, then run restored full quality gates
        run: uv run --no-project --python 3.15 ../probe/ci-tools/bamti-cycle/verify.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bamti-cycle-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/bamti-cycle-evidence
          if-no-files-found: error
          retention-days: 7
