name: "Recover frozen Spira r41 evidence"
on:
  push:
    branches: ["ci/spira47-catalog-cte-20261127-r41"]
    paths:
      - ".github/workflows/spira47-review-r41.yml"
      - "ci-tools/spira47-r41-recovery/**"
permissions:
  contents: read
  actions: read
concurrency:
  group: "spira47-review-r41-${{ github.ref }}"
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  archive:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 10
    steps:
      - name: Checkout isolated recovery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.9"
          python-version: "3.15"
          enable-cache: false
      - name: Authenticate and recover frozen evidence
        env:
          SPIRA_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --python 3.15 proof/ci-tools/spira47-r41-recovery/recover.py \
            "$RUNNER_TEMP/spira47-r41-recovered"
      - name: Preserve recovered evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: spira47-r41-recovered-46051338072
          path: ${{ runner.temp }}/spira47-r41-recovered
          if-no-files-found: error
          retention-days: 14
