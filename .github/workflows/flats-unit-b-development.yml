"name": "Flats Unit B development gates"
"on":
  "push":
    "branches":
      - "ci/remaining-runner-gates-20261126"
    "paths":
      - ".github/workflows/flats-unit-b-development.yml"
      - "ci-tools/flats-unit-b-development/**"
"permissions":
  "contents": "read"
  "actions": "read"
"concurrency":
  "group": "flats-unit-b-development-${{ github.run_id }}"
  "cancel-in-progress": false
"defaults":
  "run":
    "shell": "bash"
"jobs":
  "race":
    "runs-on": "depot-ubuntu-24.04"
    "timeout-minutes": 210
    "env":
      "PROOF_RUNNER": "depot-ubuntu-24.04"
      "GIT_CONFIG_COUNT": "1"
      "GIT_CONFIG_KEY_0": "core.autocrlf"
      "GIT_CONFIG_VALUE_0": "false"
      "GOENV": "off"
      "GOCACHEPROG": ""
      "PYTHONDONTWRITEBYTECODE": "1"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "ref": "${{ github.sha }}"
          "path": "probe"
          "sparse-checkout": |-
            ci-tools/flats-unit-b-development
            .github/workflows/flats-unit-b-development.yml
          "sparse-checkout-cone-mode": false
          "persist-credentials": false
      -
        "uses": "actions/checkout@v4"
        "with":
          "repository": "gosuda/flats"
          "ref": "863801718fce4cb188b072cd29e0e170a3096af2"
          "path": "source"
          "persist-credentials": false
          "fetch-depth": 1
      -
        "uses": "actions/setup-python@v5"
        "with":
          "python-version": "3.12"
      -
        "name": "Verify patch and exact candidate tree"
        "id": "prepare"
        "run": "python probe/ci-tools/flats-unit-b-development/verify.py prepare source"
      -
        "uses": "actions/setup-go@v5"
        "id": "go"
        "with":
          "go-version-file": "source/go.mod"
          "cache": false
      -
        "name": "Run authentic development gates"
        "id": "gates"
        "if": "${{ !cancelled() && steps.prepare.outcome == 'success' && steps.go.outcome == 'success' }}"
        "run": "python probe/ci-tools/flats-unit-b-development/verify.py run source \"race\""
      -
        "name": "Confirm candidate source remains unchanged"
        "if": "${{ always() && steps.prepare.outcome == 'success' }}"
        "run": "python probe/ci-tools/flats-unit-b-development/verify.py finalize source"
      -
        "uses": "actions/upload-artifact@v4"
        "if": "${{ always() }}"
        "with":
          "name": "flats-unit-b-race-${{ github.run_id }}-${{ github.run_attempt }}"
          "path": |-
            ${{ runner.temp }}/flats-unit-b-evidence/*.json
            ${{ runner.temp }}/flats-unit-b-evidence/*.log
          "if-no-files-found": "error"
          "retention-days": 30
