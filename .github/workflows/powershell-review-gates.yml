name: Verify PowerShell literal accounting
on:
  push:
    branches: [ci/powershell-literals-20261126-r12]
    paths:
      - .github/workflows/powershell-review-gates.yml
      - ci-tools/powershell-review/**
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: source
jobs:
  x64:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 20
    env:
      TARGET: x86_64-unknown-linux-gnu
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "8"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TERM_COLOR: never
      SLOPLINT_REQUIRE_FS_CAPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 948fa8b3ec6a76a02dcc2d9cb95410404c672de9
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          enable-cache: false
      - name: Verify and prepare the exact candidate
        run: uv run --no-project --python 3.15 ../proof/ci-tools/powershell-review/verify.py prepare
      - name: Prove native literal values and adapter regressions
        run: uv run --no-project --python 3.15 ../proof/ci-tools/powershell-review/verify.py x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: powershell-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/powershell-review-evidence/*.log
            ${{ runner.temp }}/powershell-review-evidence/results.json
          if-no-files-found: error
          retention-days: 7
