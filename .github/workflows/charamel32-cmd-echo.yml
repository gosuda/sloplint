name: Charamel 32 Echo exact source gates

on:
  push:
    branches: [ci/charamel32-cmd-gates-20261127]
    paths:
      - .github/workflows/charamel32-cmd-echo.yml
      - ci-tools/charamel32-cmd-echo/**

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux
            runner: depot-ubuntu-24.04
          - lane: windows
            runner: depot-windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Preserve source bytes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: proof
          sparse-checkout: ci-tools/charamel32-cmd-echo
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gosuda/Charamel
          ref: f879b0156aa32a317cb0e29609df53786a09ec78
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Authenticate preparation and apply the exact candidate
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.13 proof/ci-tools/charamel32-cmd-echo/gates.py preflight
      - name: Replay complete frozen native Cmd observations
        if: runner.os == 'Windows'
        id: native-cmd
        run: uv run --no-project --python 3.13 proof/ci-tools/charamel32-cmd-echo/gates.py windows-native
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        id: ocaml
        with:
          ocaml-compiler: 5.5.1
          windows-compiler: mingw
          opam-pin: false
          cache: false
      - name: Create the required rd switch and install repository dependencies
        if: ${{ !cancelled() && steps.ocaml.outcome == 'success' }}
        id: deps
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          opam switch export ../evidence/setup-compiler.export --freeze
          opam switch import ../evidence/setup-compiler.export --switch=rd --yes
          eval "$(opam env --switch=rd --set-switch)"
          test "$(opam switch show)" = rd
          test "$(ocamlc -version)" = 5.5.1
          opam install . --deps-only --with-test --yes
          opam install ocamlformat.0.29.0 --yes
      - name: Run prescribed source gates and native permissions
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run --no-project --python 3.13 proof/ci-tools/charamel32-cmd-echo/gates.py gates ${{ matrix.lane }}
      - name: Verify final candidate identity
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: uv run --no-project --python 3.13 proof/ci-tools/charamel32-cmd-echo/gates.py identity
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: charamel32-echo-gates-${{ matrix.lane }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
