{
  "name": "Flats witnessed Sheet baseline cases",
  "on": {
    "push": {
      "branches": [
        "ci/flats-sheet-baseline-20261126-r14"
      ],
      "paths": [
        ".github/workflows/flats-sheet-baseline.yml",
        "ci-tools/flats-sheet-baseline/**"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "flats-sheet-baseline-${{ github.run_id }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "linux": {
      "runs-on": "depot-ubuntu-24.04",
      "timeout-minutes": 45,
      "env": {
        "PROOF_RUNNER": "depot-ubuntu-24.04",
        "GOENV": "off",
        "GOCACHEPROG": "",
        "GIT_CONFIG_COUNT": "1",
        "GIT_CONFIG_KEY_0": "core.autocrlf",
        "GIT_CONFIG_VALUE_0": "false",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "path": "probe",
            "sparse-checkout": "ci-tools/flats-sheet-baseline\n.github/workflows/flats-sheet-baseline.yml",
            "sparse-checkout-cone-mode": false,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "gosuda/flats",
            "ref": "863801718fce4cb188b072cd29e0e170a3096af2",
            "path": "source",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/setup-go@v5",
          "with": {
            "go-version-file": "source/go.mod",
            "cache": false
          }
        },
        {
          "name": "Record unchanged baseline, resources and witnessed tests",
          "shell": "bash",
          "run": "export GOENV=off GOCACHEPROG=''\ntest -z \"$(go env GOCACHEPROG)\"\npython probe/ci-tools/flats-sheet-baseline/verify.py source linux"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "flats-sheet-baseline-linux-${{ github.run_id }}",
            "path": "${{ runner.temp }}/flats-sheet-baseline-linux",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
    "windows": {
      "runs-on": "depot-windows-2025",
      "timeout-minutes": 45,
      "env": {
        "PROOF_RUNNER": "depot-windows-2025",
        "GOENV": "off",
        "GOCACHEPROG": "",
        "GIT_CONFIG_COUNT": "1",
        "GIT_CONFIG_KEY_0": "core.autocrlf",
        "GIT_CONFIG_VALUE_0": "false",
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "path": "probe",
            "sparse-checkout": "ci-tools/flats-sheet-baseline\n.github/workflows/flats-sheet-baseline.yml",
            "sparse-checkout-cone-mode": false,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "gosuda/flats",
            "ref": "863801718fce4cb188b072cd29e0e170a3096af2",
            "path": "source",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/setup-go@v5",
          "with": {
            "go-version-file": "source/go.mod",
            "cache": false
          }
        },
        {
          "name": "Record unchanged baseline, resources and witnessed tests",
          "shell": "pwsh",
          "run": "$env:GOENV = 'off'\n$env:GOCACHEPROG = ''\nif ((go env GOCACHEPROG) -ne '') { throw 'unexpected Go cache program' }\npython probe/ci-tools/flats-sheet-baseline/verify.py source windows\nexit $LASTEXITCODE"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "flats-sheet-baseline-windows-${{ github.run_id }}",
            "path": "${{ runner.temp }}/flats-sheet-baseline-windows",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
