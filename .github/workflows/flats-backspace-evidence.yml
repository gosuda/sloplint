name: Inspect the pinned CodeMirror DOM reader sources
on:
  push:
    branches: [ci/flats-backspace-evidence-20261126-r13]
    paths:
      - .github/workflows/flats-backspace-evidence.yml
      - ci-tools/flats-backspace/**
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  inspect:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: ci-tools/flats-backspace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/flats
          ref: 72a25911d41dbe8d7e59d2e3694d4520a26e8e58
          path: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/flats
          ref: ee49a47179b2df82a70015b0978468b1fbd69e28
          path: pr272
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.13.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          enable-cache: false
      - name: Inspect exact locked package source and preserve clean trees
        run: uv run --no-project --python 3.15 proof/ci-tools/flats-backspace/inspect.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: flats-codemirror-source-${{ github.sha }}
          path: ${{ runner.temp }}/flats-codemirror-source/*
          if-no-files-found: error
          retention-days: 7
