name: Freeze the new PowerShell review witnesses
on:
  push:
    branches: [ci/powershell-round14-20261126]
    paths:
      - .github/workflows/powershell-round14.yml
      - ci-tools/powershell-round14/**
permissions:
  contents: read
jobs:
  baseline:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "8"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: ci-tools/powershell-round14
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 82ad44d49ca3c33060f4585dc8582697f603d118
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          enable-cache: false
      - name: Run frozen baseline controls
        run: uv run --no-project --python 3.15 proof/ci-tools/powershell-round14/verify.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: powershell-round14-${{ github.sha }}
          path: |
            ${{ runner.temp }}/powershell-round14/*.log
            ${{ runner.temp }}/powershell-round14/*.json
          if-no-files-found: error
          retention-days: 7
