name: Charamel 32 native FOR option observations

on:
  push:
    branches: [ci/charamel32-cmd-gates-20261127]
    paths:
      - .github/workflows/charamel32-cmd-options.yml
      - ci-tools/charamel32-cmd-options/**

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  observe:
    runs-on: depot-windows-2025
    timeout-minutes: 10
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: proof
          sparse-checkout: ci-tools/charamel32-cmd-options
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gosuda/Charamel
          ref: 5be8cba8e9150be37b35dec47f2cace5647d704f
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Observe the frozen option strings in native Cmd
        run: uv run --no-project --python 3.13 proof/ci-tools/charamel32-cmd-options/observe.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: charamel32-native-for-options
          path: evidence
          if-no-files-found: error
          retention-days: 30
