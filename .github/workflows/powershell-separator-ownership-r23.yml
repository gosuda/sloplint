name: Inspect preserved PowerShell argument output
on:
  push:
    branches: [ci/powershell-separator-ownership-20261126-r23]
    paths:
      - .github/workflows/powershell-separator-ownership-r23.yml
      - ci-tools/powershell-separator-ownership-r23/**
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  inspect:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: ci-tools/powershell-separator-ownership-r23
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 15160844099
          skip-decompress: true
          digest-mismatch: error
          run-id: 45913796869
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/powershell-separator-ownership-r23/argument-log
      - name: Read the authenticated full focused-test log without source execution
        run: uv run --no-project --python 3.15 proof/ci-tools/powershell-separator-ownership-r23/inspect-argument-log.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: powershell-argument-log-inspection-${{ github.sha }}
          path: |
            ${{ runner.temp }}/powershell-separator-ownership-r23/argument-log/inspection.json
            ${{ runner.temp }}/powershell-separator-ownership-r23/argument-log/focused-original.log
          if-no-files-found: error
          retention-days: 7
