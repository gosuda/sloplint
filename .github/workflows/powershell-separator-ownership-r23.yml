name: Verify PowerShell separator ownership
on:
  push:
    branches: [ci/powershell-separator-ownership-20261126-r23]
    paths:
      - .github/workflows/powershell-separator-ownership-r23.yml
      - ci-tools/powershell-separator-ownership-r23/**
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  experiments:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: ci-tools/powershell-separator-ownership-r23
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 57adc9fff126a9826e0fb0be921c28e6cdb08391
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Evaluate isolated grammar stages against frozen native and Query contracts
        run: uv run --no-project --python 3.15 proof/ci-tools/powershell-separator-ownership-r23/experiment.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: powershell-separator-ownership-experiment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/powershell-separator-ownership-r23/*.log
            ${{ runner.temp }}/powershell-separator-ownership-r23/*.json
            ${{ runner.temp }}/powershell-separator-ownership-r23/experiment-packed.json.gz
          if-no-files-found: error
          retention-days: 7
