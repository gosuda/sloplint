name: Verify PowerShell comment ownership source gates
on:
  push:
    branches: [ci/powershell-separator-ownership-20261126-r23]
    paths:
      - .github/workflows/powershell-separator-ownership-r23.yml
      - ci-tools/powershell-separator-ownership-r23/**
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 40
    outputs:
      stages_sha256: ${{ steps.prepare.outputs.stages_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: ci-tools/powershell-separator-ownership-r23
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e7ee97e84246863766ec7465777a035134533feb
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 15151180936
          skip-decompress: true
          digest-mismatch: error
          run-id: 45888591536
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/powershell-separator-ownership-r23/baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 15160844099
          skip-decompress: true
          digest-mismatch: error
          run-id: 45913796869
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/powershell-separator-ownership-r23/ownership-verified
      - name: Generate exact staged candidates and compare native semantics
        id: prepare
        run: uv run --no-project --python 3.15 proof/ci-tools/powershell-separator-ownership-r23/verify.py prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: powershell-separator-ownership-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/powershell-separator-ownership-r23/*.log
            ${{ runner.temp }}/powershell-separator-ownership-r23/*.json
            ${{ runner.temp }}/powershell-separator-ownership-r23/stages.json.gz
          if-no-files-found: error
          retention-days: 7
  x64:
    needs: prepare
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    env:
      STAGES_SHA256: ${{ needs.prepare.outputs.stages_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: ci-tools/powershell-separator-ownership-r23
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e7ee97e84246863766ec7465777a035134533feb
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: powershell-separator-ownership-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/powershell-separator-ownership-r23/transfer
      - name: Verify x64 source gates and exact candidate identity
        run: uv run --no-project --python 3.15 proof/ci-tools/powershell-separator-ownership-r23/verify.py x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: powershell-separator-ownership-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/powershell-separator-ownership-r23/*.log
            ${{ runner.temp }}/powershell-separator-ownership-r23/*.json
            ${{ runner.temp }}/powershell-separator-ownership-r23/stages.json.gz
          if-no-files-found: error
          retention-days: 7
  arm64:
    needs: prepare
    runs-on: depot-ubuntu-24.04-arm-8
    timeout-minutes: 60
    env:
      STAGES_SHA256: ${{ needs.prepare.outputs.stages_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: ci-tools/powershell-separator-ownership-r23
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e7ee97e84246863766ec7465777a035134533feb
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: powershell-separator-ownership-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/powershell-separator-ownership-r23/transfer
      - name: Verify arm64 source gates and exact candidate identity
        run: uv run --no-project --python 3.15 proof/ci-tools/powershell-separator-ownership-r23/verify.py arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: powershell-separator-ownership-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/powershell-separator-ownership-r23/*.log
            ${{ runner.temp }}/powershell-separator-ownership-r23/*.json
            ${{ runner.temp }}/powershell-separator-ownership-r23/stages.json.gz
          if-no-files-found: error
          retention-days: 7
  lint:
    needs: prepare
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    env:
      STAGES_SHA256: ${{ needs.prepare.outputs.stages_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: ci-tools/powershell-separator-ownership-r23
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e7ee97e84246863766ec7465777a035134533feb
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: powershell-separator-ownership-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/powershell-separator-ownership-r23/transfer
      - name: Verify lint source gates and exact candidate identity
        run: uv run --no-project --python 3.15 proof/ci-tools/powershell-separator-ownership-r23/verify.py lint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: powershell-separator-ownership-lint-${{ github.sha }}
          path: |
            ${{ runner.temp }}/powershell-separator-ownership-r23/*.log
            ${{ runner.temp }}/powershell-separator-ownership-r23/*.json
            ${{ runner.temp }}/powershell-separator-ownership-r23/stages.json.gz
          if-no-files-found: error
          retention-days: 7
