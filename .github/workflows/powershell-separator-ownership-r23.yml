name: Verify PowerShell separator ownership
on:
  push:
    branches: [ci/powershell-separator-ownership-20261126-r23]
    paths:
      - .github/workflows/powershell-separator-ownership-r23.yml
      - ci-tools/powershell-separator-ownership-r23/**
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  experiments:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: ci-tools/powershell-separator-ownership-r23
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e7ee97e84246863766ec7465777a035134533feb
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 15158893506
          skip-decompress: true
          digest-mismatch: error
          run-id: 45908737910
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/powershell-separator-ownership-r23/external-baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 15158408204
          skip-decompress: true
          digest-mismatch: error
          run-id: 45907682159
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/powershell-separator-ownership-r23/guard-baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 15159249262
          skip-decompress: true
          digest-mismatch: error
          run-id: 45910252434
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/powershell-separator-ownership-r23/prefix-baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 15160844099
          skip-decompress: true
          digest-mismatch: error
          run-id: 45913796869
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/powershell-separator-ownership-r23/rejected-second-guard
      - name: Verify last-comment and redirect guards against frozen contracts
        run: uv run --no-project --python 3.15 proof/ci-tools/powershell-separator-ownership-r23/guard-experiment.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: powershell-separator-ownership-experiment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/powershell-separator-ownership-r23/*.log
            ${{ runner.temp }}/powershell-separator-ownership-r23/*.json
            ${{ runner.temp }}/powershell-separator-ownership-r23/experiment-packed.json.gz
          if-no-files-found: error
          retention-days: 7
