name: Verify native Windows recovery input

on:
  push:
    branches: [ci/charamel-required-gates-20261126-r7]
    paths:
      - .github/workflows/charamel-windows-console.yml
      - ci-tools/charamel-windows-*

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04-8, depot-windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      OPAMJOBS: '4'
      DUNEJOBS: '4'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/Charamel
          ref: a17c54323acbc0684da0d3c2bb32b2b34ba385fb
          persist-credentials: false
          path: candidate
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
        with:
          ocaml-compiler: '5.5.1'
          windows-compiler: mingw
          opam-pin: false
          cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Fetch immutable Windows baseline evidence
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          curl --fail --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/gosuda/sloplint/actions/artifacts/15110611238/zip -o "$GITHUB_WORKSPACE/evidence/previous-windows.zip"
      - name: Install rd and the pinned formatter
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          if [ "$RUNNER_OS" = Windows ]; then
            opam switch create rd --packages=ocaml-base-compiler.5.5.1,system-mingw --yes --jobs=4 2>&1 | tee "$GITHUB_WORKSPACE/evidence/switch.log"
          else
            opam switch create rd ocaml-base-compiler.5.5.1 --yes --jobs=4 2>&1 | tee "$GITHUB_WORKSPACE/evidence/switch.log"
          fi
          eval "$(opam env --switch=rd --set-switch --shell=bash)"
          opam install . --deps-only --with-test --yes 2>&1 | tee "$GITHUB_WORKSPACE/evidence/dependencies.log"
          opam install ocamlformat.0.29.0 --yes 2>&1 | tee "$GITHUB_WORKSPACE/evidence/formatter-install.log"
          test "$(ocamlformat --version)" = 0.29.0
          ocamlc -version > "$GITHUB_WORKSPACE/evidence/ocaml-version.txt"
          dune --version > "$GITHUB_WORKSPACE/evidence/dune-version.txt"
          opam list --installed --short > "$GITHUB_WORKSPACE/evidence/dependencies.txt"
      - name: Run complete gates and native console controls
        run: |
          set -euo pipefail
          eval "$(opam env --switch=rd --set-switch --shell=bash)"
          uv run --no-project --python 3.13 probe/ci-tools/charamel-windows-gates.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: charamel-native-console-${{ runner.os }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
