name: Verify Dalgona cleanup review
on:
  push:
    branches: [ci/remaining-review-gates-20261126-r8]
    paths:
      - .github/workflows/remaining-review-dalgona.yml
      - ci-tools/remaining-review/**
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: source
jobs:
  verify:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    env:
      GOENV: "off"
      GOCACHEPROG: ""
      GOTOOLCHAIN: local
      GOMAXPROCS: "8"
      GOPROXY: https://proxy.golang.org|https://goproxy.io|direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: probe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/dalgona
          ref: a95109e9c646463ebcd34c0e904a2b2ca8ca1296
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.9"
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - name: Verify and apply frozen candidate
        run: uv run --no-project --python 3.15 ../probe/ci-tools/remaining-review/verify.py dalgona prepare
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.4"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Activate locked package manager
        run: |
          corepack enable
          corepack prepare "$(node -p 'require("./web/package.json").packageManager')" --activate
          pnpm --version
      - name: Install graphics development packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcursor-dev libxfixes-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev pkg-config
      - name: Install pinned just
        run: |
          curl -fsSLo "$RUNNER_TEMP/just.tar.gz" https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e "$RUNNER_TEMP/just.tar.gz" | sha256sum --check --strict
          sudo tar -xzf "$RUNNER_TEMP/just.tar.gz" -C /usr/local/bin just
      - name: Run required gates and cleanup control
        run: |
          export GOENV=off GOCACHEPROG=''
          test -z "$(go env GOCACHEPROG)"
          uv run --no-project --python 3.15 ../probe/ci-tools/remaining-review/verify.py dalgona verify
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dalgona-cleanup-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
