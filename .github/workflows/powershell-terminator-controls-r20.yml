name: Observe PowerShell terminator controls
on:
  push:
    branches: [ci/powershell-three-findings-20261126-r20]
    paths:
      - .github/workflows/powershell-terminator-controls-r20.yml
      - ci-tools/powershell-terminator-controls-r20/**
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  controls:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: ci-tools/powershell-terminator-controls-r20
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: 61c88ec4d492dd1ab72f76b15b84fa9434cccfaa
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - name: Observe native control structures and verify candidate transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.15 proof/ci-tools/powershell-terminator-controls-r20/verify.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: powershell-terminator-controls-${{ github.sha }}
          path: |
            ${{ runner.temp }}/powershell-terminator-controls-r20/*.log
            ${{ runner.temp }}/powershell-terminator-controls-r20/*.json
            ${{ runner.temp }}/powershell-terminator-controls-r20/*.gz
          if-no-files-found: error
          retention-days: 7
