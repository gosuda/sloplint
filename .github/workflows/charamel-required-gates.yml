name: Verify Charamel review repairs

on:
  push:
    branches: [ci/charamel-required-gates-20261126-r7]
    paths:
      - .github/workflows/charamel-required-gates.yml
      - ci-tools/charamel-gates.py
      - ci-tools/charamel28.patch

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gates:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 75
    env:
      OPAMJOBS: '4'
      DUNEJOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/Charamel
          ref: f831b14a8a6620ee7289541b5ea53ef40e325ba3
          persist-credentials: false
          path: candidate
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
        with:
          ocaml-compiler: '5.5.1'
          opam-pin: false
          cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Install the required rd switch and pinned formatter
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          opam switch create rd ocaml-base-compiler.5.5.1 --yes --jobs=4 2>&1 | tee "$GITHUB_WORKSPACE/evidence/switch.log"
          eval "$(opam env --switch=rd --set-switch)"
          opam install . --deps-only --with-test --yes 2>&1 | tee "$GITHUB_WORKSPACE/evidence/dependencies.log"
          opam install ocamlformat.0.29.0 --yes 2>&1 | tee "$GITHUB_WORKSPACE/evidence/formatter-install.log"
          test "$(ocamlformat --version)" = 0.29.0
          ocamlc -version > "$GITHUB_WORKSPACE/evidence/ocaml-version.txt"
          dune --version > "$GITHUB_WORKSPACE/evidence/dune-version.txt"
          opam list --installed --short > "$GITHUB_WORKSPACE/evidence/dependencies.txt"
      - name: Run all three repository gates for each exact candidate
        run: |
          set -euo pipefail
          eval "$(opam env --switch=rd --set-switch)"
          uv run --no-project --python 3.13 probe/ci-tools/charamel-gates.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: charamel-required-gates-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
