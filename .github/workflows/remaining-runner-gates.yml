name: Remaining public runner gates

on:
  push:
    branches: [ci/remaining-runner-gates-20261126]
    paths:
      - .github/workflows/remaining-runner-gates.yml
      - ci-tools/remaining-*
      - ci-tools/website-ci.patch

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  elegant-quality-baselines:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: original-pr
            head: 3d6bc75bf7f4c00f9a587727c1d8748894524520
          - label: actual-main
            head: 277e83b2e3d80c14f75334869b86a607c7ab3ffd
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    env:
      BASELINE_HEAD: ${{ matrix.head }}
      GOENV: 'off'
      GOCACHEPROG: ''
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
      CARGO_BUILD_JOBS: '2'
      LEAN_NUM_THREADS: '2'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/elegant-mermaid
          ref: ${{ matrix.head }}
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Verify candidate identity
        run: uv run --no-project --python 3.13 probe/ci-tools/remaining-elegant-gates.py baseline-prepare
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: source/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.1'
      - run: npm install --global pnpm@12.23.0
      - name: Install the pinned Rust toolchain
        working-directory: source
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: source
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: "just@1.59.0,cargo-nextest@0.9.151"
      - name: Run quality gates with recorded exit codes
        run: |
          export GOENV=off GOCACHEPROG=''
          test -z "$(go env GOCACHEPROG)"
          uv run --no-project --python 3.13 probe/ci-tools/remaining-elegant-gates.py baseline-quality
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-elegant-quality-${{ matrix.label }}-${{ github.sha }}
          path: |
            evidence/
          if-no-files-found: error
          retention-days: 14

  elegant-windows:
    runs-on: depot-windows-2025
    timeout-minutes: 20
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
      CARGO_BUILD_JOBS: '2'
      LEAN_NUM_THREADS: '2'
      PYTHONIOENCODING: utf-8
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/elegant-mermaid
          ref: 3d6bc75bf7f4c00f9a587727c1d8748894524520
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Verify candidate identity
        run: uv run --no-project --python 3.13 probe/ci-tools/remaining-elegant-gates.py prepare
      - name: Install the pinned Rust toolchain
        working-directory: source
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: "just@1.59.0"
      - name: Run windows gates with recorded exit codes
        run: |
          uv run --no-project --python 3.13 probe/ci-tools/remaining-elegant-gates.py windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-elegant-windows-${{ github.sha }}
          path: |
            evidence/
          if-no-files-found: error
          retention-days: 14

  elegant-markdown:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
      CARGO_BUILD_JOBS: '2'
      LEAN_NUM_THREADS: '2'
      PYTHONIOENCODING: utf-8
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/elegant-mermaid
          ref: 3d6bc75bf7f4c00f9a587727c1d8748894524520
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Verify candidate identity
        run: uv run --no-project --python 3.13 probe/ci-tools/remaining-elegant-gates.py prepare
      - name: Install the pinned Rust toolchain
        working-directory: source
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: "just@1.59.0"
      - name: Run windows gates with recorded exit codes
        run: |
          uv run --no-project --python 3.13 probe/ci-tools/remaining-elegant-gates.py markdown
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-elegant-markdown-${{ github.sha }}
          path: |
            evidence/
          if-no-files-found: error
          retention-days: 14

  ssh-prepare:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fatheradvisor/ssh-chat
          ref: 1dd8ea93aad5a9a1543db75d05c3609ac0dcdc3e
          persist-credentials: false
          path: source
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Format the concrete reconciliation and resolve its pinned modules
        run: |
          export GOENV=off GOCACHEPROG=''
          test -z "$(go env GOCACHEPROG)"
          uv run --no-project --python 3.13 probe/ci-tools/remaining-ssh-prepare.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-ssh-prepared-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  read-quality:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Read exact candidate quality metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.13 probe/ci-tools/remaining-read-quality.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-quality-read-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
