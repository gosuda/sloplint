name: Elegant Mermaid retained Lean diagnostics

on:
  push:
    branches: [ci/remaining-runner-gates-20261126]
    paths:
      - .github/workflows/remaining-runner-gates.yml
      - ci-tools/remaining-elegant-lean-reader.py

permissions:
  contents: read
  actions: read

jobs:
  read-pr27-lean-evidence:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: probe
          sparse-checkout: ci-tools
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Read the authenticated immutable public proof artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.13 probe/ci-tools/remaining-elegant-lean-reader.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-elegant-lean-reader-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
