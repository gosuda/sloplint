name: Remaining public runner gates

on:
  push:
    branches: [ci/remaining-runner-gates-20261126]
    paths:
      - .github/workflows/remaining-runner-gates.yml
      - ci-tools/remaining-*
      - ci-tools/website-ci.patch

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  elegant-windows:
    runs-on: depot-windows-2025
    timeout-minutes: 20
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
      CARGO_BUILD_JOBS: '2'
      LEAN_NUM_THREADS: '2'
      PYTHONIOENCODING: utf-8
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/elegant-mermaid
          ref: 3d6bc75bf7f4c00f9a587727c1d8748894524520
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Verify candidate identity
        run: uv run --no-project --python 3.13 probe/ci-tools/remaining-elegant-gates.py prepare
      - name: Install the pinned Rust toolchain
        working-directory: source
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: source
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: "just@1.59.0"
      - name: Run windows gates with recorded exit codes
        run: |
          uv run --no-project --python 3.13 probe/ci-tools/remaining-elegant-gates.py windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-elegant-windows-${{ github.sha }}
          path: |
            evidence/
          if-no-files-found: error
          retention-days: 14
