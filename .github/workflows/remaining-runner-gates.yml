name: Website preflight review gates

on:
  push:
    branches: [ci/remaining-runner-gates-20261126]
    paths:
      - .github/workflows/remaining-runner-gates.yml
      - ci-tools/remaining-website-guard*

permissions:
  contents: read
  actions: read

jobs:
  website-guard-controls:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: probe
          sparse-checkout: ci-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/website
          ref: fe872e6560fdbbe149a470205f423bf86fddb781
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Verify eight exact candidates and old/new preflight controls
        shell: bash
        run: |
          export GOENV=off GOCACHEPROG=''
          effective_gocacheprog="$(go env GOCACHEPROG)"
          test -z "$effective_gocacheprog"
          uv run --no-project --python 3.13 --with PyYAML==6.0.3 probe/ci-tools/remaining-website-guard.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-website-guard-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
