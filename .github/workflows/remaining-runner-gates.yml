name: Remaining public runner gates

on:
  push:
    branches: [ci/remaining-runner-gates-20261126]
    paths:
      - .github/workflows/remaining-runner-gates.yml
      - ci-tools/remaining-*
      - ci-tools/website-ci.patch

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  elegant-full:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
      CARGO_BUILD_JOBS: '2'
      LEAN_NUM_THREADS: '2'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/elegant-mermaid
          ref: afa5a631ec41cb1e9aa0634b2d547d084bd27e33
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Verify candidate identity
        run: uv run --no-project --python 3.13 probe/ci-tools/remaining-elegant-gates.py prepare
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: source/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.1'
      - run: npm install --global pnpm@12.23.0
      - name: Install the pinned Rust toolchain
        working-directory: source
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: source
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: "just@1.59.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,jaq@3.2.0,wasm-bindgen@0.2.130"
      - run: rustup target add wasm32-unknown-unknown
        working-directory: source
      - name: Install the pinned Lean toolchain
        run: |
          test "$(cat source/proofs/lean-toolchain)" = "leanprover/lean4:v4.35.0"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/lean.tar.zst" "https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst"
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/remaining-lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/remaining-lean"
          echo "$RUNNER_TEMP/remaining-lean/bin" >> "$GITHUB_PATH"
      - name: Install the pinned house linter and model checker
        working-directory: source
        run: |
          cargo install --git https://github.com/gosuda/sloplint --rev 72f29bae0ba1187da854e080c998b8a21f1e4640 --locked --root "$GITHUB_WORKSPACE/source/.tools/sloplint" sloplint
          echo "$GITHUB_WORKSPACE/source/.tools/sloplint/bin" >> "$GITHUB_PATH"
          mkdir -p .tools
          curl --fail --location --retry 3 --output .tools/tla2tools.jar "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  .tools/tla2tools.jar" | sha256sum --check
      - name: Install verification packages
        working-directory: source
        run: |
          pnpm --dir playground install --frozen-lockfile
          pnpm --dir tools/upstream-oracle install --frozen-lockfile
          pnpm --dir playground exec playwright install --with-deps chromium
      - name: Run full gates with recorded exit codes
        run: |
          export GOENV=off GOCACHEPROG=''
          test -z "$(go env GOCACHEPROG)"
          uv run --no-project --python 3.13 probe/ci-tools/remaining-elegant-gates.py full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-elegant-full-${{ github.sha }}
          path: |
            evidence/
          if-no-files-found: error
          retention-days: 14

