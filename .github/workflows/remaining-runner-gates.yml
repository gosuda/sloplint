name: Remaining public runner gates

on:
  push:
    branches: [ci/remaining-runner-gates-20261126]
    paths:
      - .github/workflows/remaining-runner-gates.yml
      - ci-tools/remaining-*
      - ci-tools/website-ci.patch

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  ssh-review-windows:
    runs-on: depot-windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOTOOLCHAIN: local
      PYTHONIOENCODING: utf-8
    steps:
      - name: Preserve the immutable patch bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/ssh-chat
          ref: 86fec26e725399e4638a33e804bb5ebac1af24e4
          persist-credentials: false
          path: source
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.24.4'
          cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Generate with plugins installed outside PATH
        run: |
          $env:GOENV = 'off'
          $env:GOCACHEPROG = ''
          [string]$probeGoCacheProgram = go env GOCACHEPROG
          if ($LASTEXITCODE -ne 0) { throw 'go env failed' }
          if ($probeGoCacheProgram.Trim()) { throw 'GOCACHEPROG was injected' }
          uv run --no-project --python 3.13 probe/ci-tools/remaining-ssh-windows-gates.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-ssh-review-windows-${{ github.sha }}
          path: |
            evidence/*.json
            evidence/*.log
          if-no-files-found: error
          retention-days: 14
