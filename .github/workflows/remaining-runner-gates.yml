name: Remaining public runner gates

on:
  push:
    branches: [ci/remaining-runner-gates-20261126]
    paths:
      - .github/workflows/remaining-runner-gates.yml
      - ci-tools/remaining-*
      - ci-tools/website-ci.patch

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  website-main-prepare:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/website
          ref: f2082ac85d2c0e12e92a9b8a1989cc4aee36c910
          persist-credentials: false
          path: source
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.1'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Format the actual-main Markdown without changing its text
        run: uv run --no-project --python 3.13 probe/ci-tools/remaining-website-main-prepare.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-website-main-prepare-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
