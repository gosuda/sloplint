name: Remaining public repair gates
on:
  push:
    branches: [ci/remaining-runner-gates-20261126]
    paths:
      - .github/workflows/remaining-runner-gates.yml
      - ci-tools/remaining-s137-*
permissions:
  contents: read
  actions: read
jobs:
  powershell-grammar-prepare:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: probe
          persist-credentials: false
          sparse-checkout: ci-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 948fa8b3ec6a76a02dcc2d9cb95410404c672de9
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Check the pinned parser and prepare the exact grammar artifacts
        run: uv run --no-project --python 3.13 probe/ci-tools/remaining-s137-prepare.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-s137-grammar-${{ github.sha }}
          path: |
            evidence/*.json
            evidence/*.log
          if-no-files-found: error
          retention-days: 14
