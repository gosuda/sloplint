name: Elegant Mermaid Go preflight review gates

on:
  push:
    branches: [ci/remaining-runner-gates-20261126]
    paths:
      - .github/workflows/remaining-runner-gates.yml
      - ci-tools/remaining-elegant-guard*
      - ci-tools/remaining-elegant24.patch

permissions:
  contents: read
  actions: read

jobs:
  guard-controls:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pr27
            head: 6aeb314c6196c3a21c0a2f4c1406ff52915e72ec
          - label: pr24
            head: 801d75e266e0f827817238286171c517fe84b5b2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: probe
          sparse-checkout: ci-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/elegant-mermaid
          ref: ${{ matrix.head }}
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Verify exact candidates and old/new shell controls
        shell: bash
        env:
          CASE: ${{ matrix.label }}
        run: |
          export GOENV=off GOCACHEPROG=''
          effective_gocacheprog="$(go env GOCACHEPROG)"
          test -z "$effective_gocacheprog"
          uv run --no-project --python 3.13 --with PyYAML==6.0.3 probe/ci-tools/remaining-elegant-guard.py "$CASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remaining-elegant-guard-${{ matrix.label }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
