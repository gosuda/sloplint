name: Inspect captured Charamel Windows baseline and controls

on:
  push:
    branches: [ci/charamel-required-gates-20261126-r7]
    paths: [.github/workflows/charamel-artifact-inspect.yml]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Verify and print existing failure artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/gosuda/sloplint/actions/artifacts/15110611238/zip -o evidence.zip
          echo 'cb1a860e06d1e736ed4e0ad62a6d2714dae9ed0a1579f3ec4cbdd901ef1983af  evidence.zip' | sha256sum --check -
          uv run --no-project --python 3.13 - <<'PY'
          import hashlib
          import json
          import re
          from zipfile import ZipFile
          with ZipFile("evidence.zip") as archive:
              print("ARTIFACT_FILES", json.dumps(archive.namelist()))
              for name in ("identity.json", "baseline.json", "results.json"):
                  print(f"BEGIN {name}")
                  print(archive.read(name).decode("utf-8", errors="replace"))
                  print(f"END {name}")
              reports: dict[str, dict[str, list[str]]] = {}
              for name in ("baseline-tests.log", "tests.log"):
                  data = archive.read(name)
                  clean = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", data.decode("utf-8", errors="replace"))
                  cases = sorted(set(" ".join(line.split("[FAIL]", 1)[1].strip().rstrip(chr(0x2502)).split()) for line in clean.splitlines() if "[FAIL]" in line))
                  suites = sorted(set(re.findall(r'File "(test/[^"]+/dune)"', clean)))
                  reports[name] = {"cases": cases, "suites": suites}
                  print(f"LOG_IDENTITY {name} bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}")
                  print(f"FAILURE_SUMMARY {name} {json.dumps(reports[name], sort_keys=True)}")
                  print(f"BEGIN {name}")
                  print(clean)
                  print(f"END {name}")
              additional_cases = sorted(set(reports["tests.log"]["cases"]) - set(reports["baseline-tests.log"]["cases"]))
              additional_suites = sorted(set(reports["tests.log"]["suites"]) - set(reports["baseline-tests.log"]["suites"]))
              print("ADDITIONAL_FAILURES", json.dumps({"cases": additional_cases, "suites": additional_suites}))
              for name in ("native-console.log", "stdout-independent-red.log", "stdout-independent-green.log", "input-mode-restored-red.log", "input-mode-restored-green.log"):
                  print(f"BEGIN {name}")
                  print(archive.read(name).decode("utf-8", errors="replace"))
                  print(f"END {name}")
          PY
