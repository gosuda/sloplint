name: Lean review validation

on:
  push:
    branches: [ci/lean-review-validation-20261126]
    paths:
      - .github/workflows/lean-review-validation.yml

permissions:
  contents: read

concurrency:
  group: lean-review-validation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test-generated-parser:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SLOPLINT_REQUIRE_FS_CAPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify generated parser identity
        run: |
          mkdir -p "$RUNNER_TEMP/lean-validation/logs"
          printf '%s\n' 'c6a503fd51535258b83c0edff4acf5d4df6d523d79514fa08160c34cc8f54b68  vendor/tree-sitter-lean/src/parser.c.gz' | sha256sum --check --strict
          git rev-parse HEAD > "$RUNNER_TEMP/lean-validation/logs/SOURCE_COMMIT"
          rustc --version --verbose > "$RUNNER_TEMP/lean-validation/logs/RUSTC_VERSION"
          cargo fmt --all --check
      - name: Run workspace Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/lean-validation/logs/clippy.log"
      - name: Run Lean adapter regressions
        if: ${{ !cancelled() }}
        run: |
          cargo test -p sloplint-syntax --test grammar_gaps lean:: --locked 2>&1 | tee "$RUNNER_TEMP/lean-validation/logs/lean-tests.log"
      - name: Build CLI for contributor gates
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked -p sloplint 2>&1 | tee "$RUNNER_TEMP/lean-validation/logs/build-cli.log"
          cp target/debug/sloplint "$RUNNER_TEMP/lean-validation/sloplint"
          "$RUNNER_TEMP/lean-validation/sloplint" --version > "$RUNNER_TEMP/lean-validation/logs/CLI_VERSION"
          sha256sum "$RUNNER_TEMP/lean-validation/sloplint" > "$RUNNER_TEMP/lean-validation/logs/CLI_SHA256"
      - name: Run contributor self-lint
        run: |
          "$RUNNER_TEMP/lean-validation/sloplint" check crates --format agent --strictness standard --mode threshold --fail-on minor 2>&1 | tee "$RUNNER_TEMP/lean-validation/logs/self-lint.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: lean-rust-and-cli-${{ github.sha }}
          path: ${{ runner.temp }}/lean-validation/
          if-no-files-found: error
          retention-days: 2
