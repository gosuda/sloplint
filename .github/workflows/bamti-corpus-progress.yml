name: Diagnose pending relation cache capacity
on:
  push:
    branches: [ci/bamti-corpus-progress-20261126-r12]
    paths:
      - .github/workflows/bamti-corpus-progress.yml
      - ci-tools/bamti-corpus/**
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: source
jobs:
  compare:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: probe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/bamTiScript
          ref: 2c56f2165c237c591a684164d934ab67a1f2de4b
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install pinned compiler dependencies
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          npm ci
      - name: Compare bounded and unbounded diagnostic cache with restored source
        run: uv run --no-project --python 3.15 ../probe/ci-tools/bamti-corpus/verify.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bamti-corpus-progress-${{ github.sha }}
          path: ${{ runner.temp }}/bamti-corpus-evidence
          if-no-files-found: error
          retention-days: 7
