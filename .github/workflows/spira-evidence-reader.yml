name: Inspect Spira proof artifacts
on:
  push:
    branches: [ci/spira-required-gates-20261126-r7]
    paths:
      - .github/workflows/spira-evidence-reader.yml
      - ci-tools/spira-evidence-reader.py
      - ci-tools/audit-group1-runners.py
      - ci-tools/group1_round7_runner_sources.json
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  evidence:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Verify artifact bytes and source identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.13 ci-tools/spira-evidence-reader.py
      - name: Expand every current runner matrix
        run: uv run --no-project --python 3.13 --with pyyaml ci-tools/audit-group1-runners.py
