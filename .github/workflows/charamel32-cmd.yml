name: Charamel 32 current head source gates

on:
  push:
    branches: [ci/charamel32-cmd-gates-20261127]
    paths:
      - .github/workflows/charamel32-cmd.yml
      - ci-tools/charamel32-cmd/**

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"

jobs:
  current-head:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: proof
          sparse-checkout: ci-tools/charamel32-cmd
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gosuda/Charamel
          ref: 38d586ae3b2bce634e854990844f1db0b7642618
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Authenticate exact native proof and current candidate
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.13 proof/ci-tools/charamel32-cmd/gates.py preflight
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        id: ocaml
        with:
          ocaml-compiler: 5.5.1
          opam-pin: false
          cache: false
      - name: Create the required rd switch and install repository dependencies
        if: ${{ !cancelled() && steps.ocaml.outcome == 'success' }}
        id: deps
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          opam switch export ../evidence/setup-compiler.export --freeze
          opam switch import ../evidence/setup-compiler.export --switch=rd --yes
          eval "$(opam env --switch=rd --set-switch)"
          test "$(opam switch show)" = rd
          test "$(ocamlc -version)" = 5.5.1
          opam install . --deps-only --with-test --yes
          opam install ocamlformat.0.29.0 --yes
      - name: Run all prescribed current-source gates
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run --no-project --python 3.13 proof/ci-tools/charamel32-cmd/gates.py gates linux
      - name: Verify final candidate identity
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: uv run --no-project --python 3.13 proof/ci-tools/charamel32-cmd/gates.py identity
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: charamel32-reconciled-gates-linux
          path: evidence
          if-no-files-found: error
          retention-days: 30
