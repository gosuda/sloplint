name: Charamel 32 Cmd native baseline

on:
  push:
    branches: [ci/charamel32-cmd-gates-20261127]
    paths:
      - .github/workflows/charamel32-cmd.yml
      - ci-tools/charamel32-cmd/**

permissions:
  contents: read
  actions: read

jobs:
  native-baseline:
    runs-on: depot-windows-2025
    timeout-minutes: 10
    steps:
      - name: Preserve Git blob line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: proof
          sparse-checkout: ci-tools/charamel32-cmd
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gosuda/Charamel
          ref: 53cdbc3dd32e34cf0ac6769b1fead9c14dad10a5
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Freeze actual native Cmd syntax and output
        shell: pwsh
        run: uv run --no-project --python 3.13 proof/ci-tools/charamel32-cmd/native.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: charamel32-native-baseline
          path: evidence
          if-no-files-found: error
          retention-days: 30
