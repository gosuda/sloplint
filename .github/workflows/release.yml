name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  create:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""

  build:
    needs: create
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-26-intel, target: x86_64-apple-darwin }
          - { os: macos-26, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    env:
      GH_TOKEN: ${{ github.token }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive Unix
        if: runner.os != 'Windows'
        run: |
          name="sloplint-$GITHUB_REF_NAME-${{ matrix.target }}"
          tar -czf "$name.tar.gz" -C "target/${{ matrix.target }}/release" sloplint -C "$GITHUB_WORKSPACE" LICENSE
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "$GITHUB_REF_NAME" "$name.tar.gz" "$name.tar.gz.sha256"
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "sloplint-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/sloplint.exe", "LICENSE" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath "$name.zip.sha256" -Encoding ascii -NoNewline
          gh release upload "$env:GITHUB_REF_NAME" "$name.zip" "$name.zip.sha256"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
