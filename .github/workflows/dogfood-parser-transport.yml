name: Stage verified dogfood parser objects

on:
  push:
    branches: [work/dogfood-parser-objects-20261116]

permissions:
  contents: write

jobs:
  store:
    if: github.repository == 'gosuda/sloplint' && github.ref == 'refs/heads/work/dogfood-parser-objects-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Restore and verify generated bytes
        run: node .parser-transport/restore.mjs
      - name: Store parser blobs on the staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- vendor/tree-sitter-cpp/src/parser.c vendor/tree-sitter-kotlin-ng/src/parser.c
          git commit -m 'Store verified generated parser objects'
          git push origin HEAD:refs/heads/work/dogfood-parser-objects-20261116
