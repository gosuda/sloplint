name: Verify voice runtime compatibility
on:
  push:
    branches: [ci/dstack-voice-runtime-20261127-r32]
    paths:
      - .github/workflows/dstack-voice-runtime-r32.yml
      - ci-tools/dstack-voice-runtime-r32/**
permissions:
  contents: read
jobs:
  verify:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            ci-tools/dstack-voice-runtime-r32
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/dstack-skills
          ref: 3fd028e709641b72b75afe7bdb7785bedca2a959
          path: .outline/worktree/dstack-skills
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: '0.13.9'
          python-version: '3.15'
          enable-cache: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: '1.46.0'
      - name: Install exact gate tools and supported interpreters
        run: |
          set -euo pipefail
          uv python install 3.9 3.10
          uv tool install --python 3.15 prek==0.5.12
      - name: Prove startup compatibility and run required repository gate
        run: uv run --no-project --python 3.15 proof/ci-tools/dstack-voice-runtime-r32/prove.py
      - name: Verify restored source
        if: always()
        working-directory: .outline/worktree/dstack-skills
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3fd028e709641b72b75afe7bdb7785bedca2a959
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dstack-voice-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/dstack-voice-runtime-r32
          if-no-files-found: error
          retention-days: 14
