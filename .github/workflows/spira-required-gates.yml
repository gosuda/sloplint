name: Verify Spira HTTP3 base integration

on:
  push:
    branches: [ci/spira-http3-merge-20261126-r12]
    paths:
      - .github/workflows/spira-required-gates.yml
      - ci-tools/spira-merge/**

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  gates:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 75
    env:
      GOENV: 'off'
      GOCACHEPROG: ''
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      GOFLAGS: '-p=4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/spira
          ref: 8761c43a6bdd231ce9fd29ff07f5a5074ea0d332
          persist-credentials: false
          path: spira
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/LoGOs
          ref: 2cfe17218b4d3311c5746b94a1858bf3fe9a3e45
          persist-credentials: false
          path: logos
      - name: Prepare the evidence directory
        run: mkdir -p "$GITHUB_WORKSPACE/evidence"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.18.0'
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: '1.59.0'
      - name: Install the locked frontend package manager
        run: npm install --global pnpm@12.21.0
      - name: Verify the existing native sloplint CLI
        id: cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sloplint-cli.zip"
          gh api /repos/gosuda/sloplint/actions/artifacts/15091303567/zip > "$archive"
          printf '%s  %s\n' e362f672d39498374a637a68ded7f57205b415e68006a4dc4a4a882405f5af33 "$archive" | sha256sum --check --strict
          unzip -q "$archive" sloplint logs/SOURCE_COMMIT -d "$RUNNER_TEMP/sloplint-cli"
          test "$(cat "$RUNNER_TEMP/sloplint-cli/logs/SOURCE_COMMIT")" = bc2067d1ec888789e6584dc6a24e8c67d1b0b506
          printf '%s  %s\n' a04c9c3e53c8aae18e2d5f89faaf3ad68b89980218ca9d1fc4af5ce487401024 "$RUNNER_TEMP/sloplint-cli/sloplint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/sloplint-cli/sloplint"
          printf '%s\n' "$RUNNER_TEMP/sloplint-cli" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sloplint-cli/sloplint" --version > evidence/sloplint-version.txt
      - name: Build the exact validated LoGOs source
        id: toolchain
        working-directory: logos
        run: |
          set -euo pipefail
          export GOENV=off GOCACHEPROG=''
          go env GOENV GOCACHEPROG > "$GITHUB_WORKSPACE/evidence/bootstrap-cache-environment.txt"
          cache_program="$(go env GOCACHEPROG)"
          test -z "$cache_program"
          test "$(git rev-parse HEAD)" = 2cfe17218b4d3311c5746b94a1858bf3fe9a3e45
          git rev-parse HEAD > "$GITHUB_WORKSPACE/evidence/logos-source.txt"
          git rev-parse HEAD^{tree} >> "$GITHUB_WORKSPACE/evidence/logos-source.txt"
          bootstrap_root="$(go env GOROOT)"
          export GOROOT_BOOTSTRAP="$bootstrap_root"
          printf 'UPSTREAM_GO=%s/bin/go\n' "$GOROOT_BOOTSTRAP" >> "$GITHUB_ENV"
          (cd src && ./make.bash) 2>&1 | tee "$GITHUB_WORKSPACE/evidence/toolchain.log"
          printf '%s/bin\n' "$PWD" >> "$GITHUB_PATH"
          printf 'LOGOS_ROOT=%s\n' "$PWD" >> "$GITHUB_ENV"
          bin/logos version > "$GITHUB_WORKSPACE/evidence/logos-version.txt"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Run exact merged source through the required gate and eject
        working-directory: spira
        run: |
          set -euo pipefail
          export GOENV=off GOCACHEPROG=''
          "$LOGOS_ROOT/bin/go" env GOENV GOCACHEPROG > "$GITHUB_WORKSPACE/evidence/gate-cache-environment.txt"
          cache_program="$("$LOGOS_ROOT/bin/go" env GOCACHEPROG)"
          test -z "$cache_program"
          GOROOT="$LOGOS_ROOT" uv run --no-project --python 3.15 ../probe/ci-tools/spira-merge/verify.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: spira-required-gates-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
