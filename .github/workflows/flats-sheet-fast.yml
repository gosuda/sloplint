name: Flats Sheet corrected fast gates
on:
  push:
    branches: [ci/flats-sheet-fast-20261126-r14]
    paths: [.github/workflows/flats-sheet-fast.yml, 'ci-tools/flats-sheet-fast/**']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  fast:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gosuda/Flats
          ref: 38e6d5688bb4d694d096c218def65331b41dc369
          path: source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.4
          cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: '3.12'
          enable-cache: false
      - name: Verify corrected candidate and run fast gates
        run: uv run --no-project --python 3.12 python proof/ci-tools/flats-sheet-fast/verify.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: flats-sheet-fast-${{ github.sha }}
          path: ${{ runner.temp }}/flats-sheet-fast
          if-no-files-found: error
          retention-days: 14
