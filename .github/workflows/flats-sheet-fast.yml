name: Read complete saved Sheet development evidence
on:
  push:
    branches: [ci/flats-sheet-fast-20261126-r14]
    paths: [.github/workflows/flats-sheet-fast.yml, 'ci-tools/flats-sheet-fast/**']
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: ci-tools/flats-sheet-fast
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: '3.15'
          enable-cache: false
      - name: Verify immutable artifact digests and report actual failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.15 python proof/ci-tools/flats-sheet-fast/inspect.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: flats-sheet-artifact-summary-${{ github.sha }}
          path: ${{ runner.temp }}/flats-sheet-artifact-summary/summary.json
          if-no-files-found: error
          retention-days: 14
