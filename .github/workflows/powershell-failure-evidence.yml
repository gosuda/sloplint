name: Read exact PowerShell workspace failures
on:
  push:
    branches: [ci/powershell-failure-evidence-20261126-r12]
    paths:
      - .github/workflows/powershell-failure-evidence.yml
      - ci-tools/powershell-failure-evidence.py
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: 0.13.9
          python-version: "3.15"
          enable-cache: false
      - name: Verify archives and read complete failure sections
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/gosuda/sloplint/actions/artifacts/15121837887/zip > x64.zip
          gh api /repos/gosuda/sloplint/actions/artifacts/15122198080/zip > arm.zip
          uv run --no-project --python 3.15 ci-tools/powershell-failure-evidence.py
