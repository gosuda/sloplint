name: Charamel 32 native redirection ownership

on:
  push:
    branches: [ci/charamel32-cmd-gates-20261127]
    paths:
      - .github/workflows/charamel32-cmd-redirection.yml
      - ci-tools/charamel32-cmd-redirection/**

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"

jobs:
  native:
    runs-on: depot-windows-2025
    timeout-minutes: 12
    steps:
      - name: Preserve immutable source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: proof
          sparse-checkout: ci-tools/charamel32-cmd-redirection
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gosuda/Charamel
          ref: c00962f26db32a41cfc1c487027a8b6316cb8bf1
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Observe outer and inner redirection with owned process evidence
        shell: pwsh
        run: uv run --no-project --python 3.13 proof/ci-tools/charamel32-cmd-redirection/observe.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: charamel32-native-redirection
          path: evidence
          if-no-files-found: error
          retention-days: 30
