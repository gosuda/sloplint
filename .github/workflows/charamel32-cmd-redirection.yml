name: Charamel 32 redirection and maintained payload regressions

on:
  push:
    branches: [ci/charamel32-cmd-gates-20261127]
    paths:
      - .github/workflows/charamel32-cmd-redirection.yml
      - ci-tools/charamel32-cmd-redirection/**

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"

jobs:
  prepare:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: proof
          sparse-checkout: ci-tools/charamel32-cmd-redirection
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gosuda/Charamel
          ref: c00962f26db32a41cfc1c487027a8b6316cb8bf1
          persist-credentials: false
          path: source
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6
        with:
          ocaml-compiler: 5.5.1
          opam-pin: false
          cache: false
      - name: Install the required rd switch and exact repository test dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          opam switch export ../evidence/setup-compiler.export --freeze
          opam switch import ../evidence/setup-compiler.export --switch=rd --yes
          eval "$(opam env --switch=rd --set-switch)"
          test "$(opam switch show)" = rd
          test "$(ocamlc -version)" = 5.5.1
          opam install . --deps-only --with-test --yes
          opam install ocamlformat.0.29.0 --yes
      - name: Authenticate witnesses and execute original, candidate and restored regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.13 proof/ci-tools/charamel32-cmd-redirection/prepare.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: charamel32-redirection-preparation
          path: evidence
          if-no-files-found: error
          retention-days: 30
